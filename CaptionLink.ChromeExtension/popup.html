<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaptionLink Live Captions</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">TG</div>
      <div>
        <h1>CaptionLink</h1>
        <p>Remote GPU captions</p>
      </div>
    </header>

    <label for="gateway-url">Gateway URL</label>
    <input
      id="gateway-url"
      type="url"
      placeholder="https://gpu-gateway.example.ts.net"
      autocomplete="url"
      spellcheck="false">

    <label for="gateway-token">Gateway token</label>
    <input
      id="gateway-token"
      type="password"
      placeholder="Enter token"
      autocomplete="off"
      spellcheck="false">

    <div class="actions">
      <button id="start" class="primary" type="button">Start captions</button>
      <button id="stop" type="button">Stop</button>
    </div>

    <p id="status" class="status" aria-live="polite">Ready.</p>
    <section id="latency" class="latency" hidden>
      <h2>Last session latency</h2>
      <p id="latency-summary"></p>
    </section>
    <p class="note">Captures audio only from the active tab you select.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
