name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows application
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CaptionLink.slnx

      - name: Build application
        run: dotnet build CaptionLink.slnx --configuration Release --no-restore

      - name: Run overlap detection tests
        run: dotnet run --project CaptionLink.OverlapDetection.Tests/CaptionLink.OverlapDetection.Tests.csproj --configuration Release --no-build

      - name: Run overlap benchmark tests
        run: dotnet run --project CaptionLink.OverlapBenchmark.Tests/CaptionLink.OverlapBenchmark.Tests.csproj --configuration Release --no-build

      - name: Run .NET tests
        run: dotnet test CaptionLink.slnx --configuration Release --no-build

      - name: Run GPULink wire protocol checks
        run: dotnet run --project CaptionLink.Speech.GPULink.Wire.Tests/CaptionLink.Speech.GPULink.Wire.Tests.csproj --configuration Release

      - name: Run GPULink resampler checks
        run: dotnet run --project CaptionLink.Audio.Processing.Resampler.Tests/CaptionLink.Audio.Processing.Resampler.Tests.csproj --configuration Release

      - name: Run GPULink ordered streaming pump checks
        run: dotnet run --project CaptionLink.Audio.Processing.StreamPump.Tests/CaptionLink.Audio.Processing.StreamPump.Tests.csproj --configuration Release

      - name: Run GPULink provider checks against public NuGet
        run: dotnet run --project CaptionLink.Speech.GPULink.Provider.Tests/CaptionLink.Speech.GPULink.Provider.Tests.csproj --configuration Release

      - name: Set up Python for GPULink adapter checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run GPULink Multitalker offline adapter checks
        run: python -m unittest discover -s tests -p test_gpulink_multitalker_adapter.py -v

      - name: Run GPULink operator-review checks
        run: node --test tools/gpulink-multitalker/test/prepare-operator-review.test.mjs

      - name: Run Chrome extension tests
        run: node --test CaptionLink.ChromeExtension/tests/protocol.test.mjs CaptionLink.ChromeExtension/tests/latency.test.mjs CaptionLink.ChromeExtension/tests/caption-state.test.mjs

      - name: Publish Windows application
        run: dotnet publish CaptionLink.Windows/CaptionLink.Windows.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/CaptionLink-win-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CaptionLink-win-x64
          path: artifacts/CaptionLink-win-x64
          if-no-files-found: error
          retention-days: 14
