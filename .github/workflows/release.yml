name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Publish Windows release
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained application
        shell: pwsh
        run: dotnet publish CaptionLink.Windows/CaptionLink.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/TransGo-win-x64

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path "publish/TransGo-win-x64/*" -DestinationPath "TransGo-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "TransGo-${{ github.ref_name }}-win-x64.zip" --verify-tag --generate-notes --title "TransGo ${{ github.ref_name }}"
